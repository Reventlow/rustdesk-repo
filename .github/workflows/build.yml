name: Build and publish package repository

# Daily check for new RustDesk releases + on every push. The build is
# idempotent: same upstream version in, same repo out. Watchtower on zima
# picks up :latest automatically.

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/reventlow/rustdesk-repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils createrepo-c ruby ruby-dev build-essential \
            rpm libarchive-tools zstd jq
          sudo gem install --no-document fpm

      - name: Import GPG signing key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Build repository tree
        run: bash scripts/build-all.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/reventlow/rustdesk-repo:latest
